<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Live 4K map of The Spiritual Home Kingdom's spiritual centres, the HQ and Ekuphumuleni, the spiritual capital.">
<meta name="theme-color" content="#0b1020">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<title>TSHK Centres Dashboard</title>
<style>
:root{
  --bg:#0b1020; --panel:#111a30; --panel-2:#16213b; --line:#2a3653;
  --ink:#f1f4fb; --ink-2:#b7c1d8; --ink-3:#7a87a6;
  --land:#1c2740; --land-line:#3a4a70; --sea:#0b1020; --country:#5d6c93;
  --blue:#4f86e6; --blue-deep:#1f4c9c; --gold:#e2b64a; --gold-soft:rgba(226,182,74,.22); --white:#ffffff;
  --f-display:"Newsreader",Georgia,serif; --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif; --f-mono:"IBM Plex Mono",Menlo,monospace;
}
:root[data-theme="light"]{
  --bg:#f3f4f7; --panel:#ffffff; --panel-2:#e9ecf2; --line:#d5dae3;
  --ink:#171c2a; --ink-2:#4f5666; --ink-3:#7d8494;
  --land:#e6e9f0; --land-line:#b9c2d3; --sea:#f3f4f7; --country:#8a94ab;
  --blue:#1f4c9c; --blue-deep:#1f4c9c; --gold:#b8891f; --gold-soft:rgba(184,137,31,.22); --white:#ffffff;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
#stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
svg{display:block;max-width:100vw;max-height:100vh;width:100%;height:100%}
.hdr-title{font-family:var(--f-display);font-weight:500;font-size:72px;fill:var(--ink)}
.hdr-sub{font-family:var(--f-body);font-weight:500;font-size:28px;letter-spacing:.18em;fill:var(--ink-3)}
.clock{font-family:var(--f-mono);font-size:64px;font-weight:500;fill:var(--ink)}
.date{font-family:var(--f-body);font-size:28px;fill:var(--ink-2)}
.stat-n{font-family:var(--f-mono);font-size:56px;font-weight:500;fill:var(--gold)}
.stat-l{font-family:var(--f-body);font-size:22px;letter-spacing:.14em;fill:var(--ink-3)}
.land{fill:var(--land);stroke:var(--land-line);stroke-width:1.5}
.border{fill:none;stroke:var(--land-line);stroke-width:1.5}
.country{font-family:var(--f-body);font-weight:600;font-size:34px;letter-spacing:.22em;fill:var(--country);text-anchor:middle;pointer-events:none}
.pin{fill:var(--blue);stroke:var(--white);stroke-width:3}
.lbl{font-family:var(--f-body);font-weight:600;font-size:27px;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:7px;stroke-linejoin:round}
.lbl.small{font-size:24px}
.lbl.hq{fill:var(--gold);font-size:30px}
.lbl.cap{fill:var(--gold);font-family:var(--f-display);font-weight:600;font-size:40px;letter-spacing:.02em}
.lbl.cap2{fill:var(--gold);font-size:24px;font-weight:500;letter-spacing:.16em}
.leader{stroke:var(--ink-3);stroke-width:1.5;fill:none;opacity:.8}
.cluster{fill:var(--gold);font-family:var(--f-body);font-weight:600;font-size:26px;paint-order:stroke;stroke:var(--bg);stroke-width:7px;stroke-linejoin:round}
.inset-frame{fill:var(--panel);stroke:var(--line);stroke-width:2}
.inset-title{font-family:var(--f-display);font-weight:500;font-size:40px;fill:var(--ink)}
.inset-sub{font-family:var(--f-body);font-size:22px;letter-spacing:.14em;fill:var(--ink-3)}
.region-name{font-family:var(--f-body);font-size:26px;font-weight:500;fill:var(--ink-2)}
.region-n{font-family:var(--f-mono);font-size:26px;fill:var(--ink);text-anchor:end}
.foot{font-family:var(--f-body);font-size:22px;fill:var(--ink-3)}
.legend-t{font-family:var(--f-body);font-size:24px;fill:var(--ink-2)}
.halo{fill:var(--gold);opacity:.35;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{transform:scale(1);opacity:.45}100%{transform:scale(2.4);opacity:0}}
.live .halo{animation:pulse 2.6s ease-out infinite}
@media (prefers-reduced-motion: reduce){.live .halo{animation:none}}
.link-box{fill:var(--panel);stroke:var(--line);stroke-width:2}
.livedot{fill:#3ddc84}
.live .livedot{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.pin,.hqpin,.capstar,.clusterhit{cursor:pointer}
#tip{position:fixed;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:clamp(13px,1.1vw,22px);line-height:1.4;max-width:min(38vw,560px);box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;transition:opacity .12s;z-index:5}
#tip b{font-family:var(--f-display);font-weight:500;font-size:1.35em;display:block;margin-bottom:2px}
#tip .k{color:var(--gold);letter-spacing:.12em;text-transform:uppercase;font-size:.75em;font-weight:600}
#tip .a{color:var(--ink-2)}
#ctl{position:fixed;left:1.2vw;bottom:2.4vh;display:flex;gap:.5vw;align-items:center;z-index:4}
#ctl button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 clamp(14px,1.1vw,24px) var(--f-body);width:clamp(36px,2.6vw,56px);height:clamp(36px,2.6vw,56px);border-radius:10px;cursor:pointer}
#ctl button:hover{border-color:var(--gold);color:var(--gold)}
#ctl .hint{color:var(--ink-3);font-size:clamp(11px,.85vw,19px);margin-left:.6vw}
#ctl button.wide{width:auto;padding:0 clamp(10px,.8vw,18px)}
#pop{position:fixed;background:var(--panel);color:var(--ink);border:1px solid var(--gold);border-radius:14px;padding:clamp(12px,1vw,22px) clamp(14px,1.2vw,26px);font-size:clamp(14px,1.15vw,24px);line-height:1.4;width:min(40vw,640px);box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:6;display:none}
#pop.show{display:block}
#pop b{font-family:var(--f-display);font-weight:500;font-size:1.5em;display:block;margin:2px 0 4px;padding-right:1.6em}
#pop .k{color:var(--gold);letter-spacing:.12em;text-transform:uppercase;font-size:.72em;font-weight:600}
#pop .a{color:var(--ink-2)}
#pop .tel{color:var(--ink);font-family:var(--f-mono);margin-top:.3em;display:block}
#pop .acts{display:flex;gap:.5em;margin-top:.8em;flex-wrap:wrap}
#pop .acts a{display:inline-block;padding:.45em .9em;border-radius:9px;background:var(--gold);color:#1a1200;text-decoration:none;font-weight:600;font-size:.85em}
#pop .acts a.q{background:var(--panel-2);color:var(--ink)}
#pop .x{position:absolute;top:.5em;right:.6em;appearance:none;border:0;background:none;color:var(--ink-3);font-size:1.4em;cursor:pointer;line-height:1}
#pop .x:hover{color:var(--gold)}
.pin.sel{stroke:var(--gold);stroke-width:5}
.paneltab{cursor:pointer}
</style>
</head>
<body>
<div id="stage"></div>
<div id="tip"></div>
<div id="pop" role="dialog" aria-live="polite"><button class="x" id="popx" aria-label="Close">×</button><span class="k" id="pk"></span><b id="pn"></b><div class="a" id="pa"></div><a class="tel" id="pt" href="#"></a><div class="acts"><a id="pdir" target="_blank" rel="noopener">Directions</a><a class="q" id="pcall" href="#">Call</a><a class="q" id="pzoom" href="#">Zoom here</a></div></div>
<div id="ctl"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="zreset" title="Reset view">⟲</button><button id="panelbtn" class="wide" title="Show or hide the regions panel">Hide regions</button><span class="hint">Drag to move · scroll or pinch to zoom · click a pin for its details · click a counter or an inset to zoom there</span></div>
<script src="dashboard-centres.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
